includes:
  - configs/tsc/base.yml
model:
  name: cmptrain1x5
  train_model: true
  test_model: false
  load_model: false
  graphic: false
  one_hot: true
  phase: true
  epsilon: 0.20
  epsilon_decay: 0.9995
  epsilon_min: 0.01
  learning_rate: 1e-05
  batch_size: 64
  gamma: 0.99
  cmp_beta: 0.60
  cmp_alpha: 0.60
  cmp_uncertainty_margin: 2.0
  override_advantage: 0.15
  max_override_rate: 0.02
  t_min: 10
trainer:
  episodes: 5
  steps: 9000
  learning_start: 1000
  buffer_size: 50000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 200
  test_steps: {args.eval_steps}
  test_when_train: true
