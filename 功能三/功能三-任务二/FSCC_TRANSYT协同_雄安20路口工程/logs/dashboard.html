<!doctype html><meta charset='utf-8'><title>Xiong'an 20-junction dashboard</title><style>body{font:14px Arial;margin:24px;color:#17212b}canvas{border:1px solid #cbd5df}pre{background:#f6f8fa;padding:12px}</style><h1>Xiong'an Rongdong: 20-junction simulation</h1><canvas id='c' width='1000' height='360'></canvas><pre id='summary'></pre><script>const rows=[{"time_s": 0, "active_vehicles": 0, "queue_proxy": 0, "actions": [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]}, {"time_s": 10, "active_vehicles": 14, "queue_proxy": 24, "actions": [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]}, {"time_s": 20, "active_vehicles": 14, "queue_proxy": 24, "actions": [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]}, {"time_s": 30, "active_vehicles": 14, "queue_proxy": 24, "actions": [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]}, {"time_s": 40, "active_vehicles": 14, "queue_proxy": 24, "actions": [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]}];let c=document.querySelector('#c'),x=c.getContext('2d'),m=Math.max(1,...rows.map(r=>r.queue_proxy));x.strokeStyle='#0b6';x.beginPath();rows.forEach((r,i)=>{let px=i*1000/Math.max(1,rows.length-1),py=340-r.queue_proxy/m*310;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();document.querySelector('#summary').textContent=JSON.stringify(rows.at(-1)||{},null,2)</script>
